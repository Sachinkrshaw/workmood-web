<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkMood | App Launching Soon</title>
  <link rel="icon" type="image/png" href="assets/workmood-logo.png" />
  <link rel="apple-touch-icon" href="assets/workmood-logo.png" />
  <meta
    name="description"
    content="The WorkMood app is launching soon for workers and hirers."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="shared-shell.css" />
  <style>
    body {
      font-family: "Inter", sans-serif;
      line-height: 1.7;
      min-height: 100vh;
    }

    main {
      min-height: calc(100vh - 78px);
      display: grid;
      place-items: center;
      padding: 72px 0 96px;
    }

    .launch-card {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.22);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-strong);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      line-height: 1;
      letter-spacing: -0.04em;
      margin: 0 0 18px;
    }

    p {
      max-width: 680px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    @media (max-width: 640px) {
      main {
        padding: 44px 0 72px;
      }

      .launch-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body data-page="launch">
  <div id="site-header"></div>

  <main>
    <section class="launch-card">
      <div class="eyebrow"><span class="dot"></span> Coming soon</div>
      <h1>WorkMood app will launch soon</h1>
      <p>
        We are getting the app ready for workers and hirers. Soon you will be able
        to find nearby work, hire workers faster, and manage service connections in
        one simple place.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="index.html">Back to Home</a>
        <a class="btn btn-secondary" href="contact%20page.html">Contact Us</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="shared-shell.js"></script>
</body>
</html>
